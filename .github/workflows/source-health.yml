# ═══════════════════════════════════════════════════════════════════════════════
# OPENTHREAT — .github/workflows/source-health.yml
#
# Daily URL validation for every external source the pipeline depends on.
# Catches "the API changed / went behind a PoW wall / started 403ing" breakage
# BEFORE the dashboard data goes stale, and files a GitHub issue when it does.
# ═══════════════════════════════════════════════════════════════════════════════

name: Source Health Check

on:
  schedule:
    - cron: '30 5 * * *'    # Daily at 05:30 UTC (before peak pipeline hours)
  workflow_dispatch:

jobs:
  validate-sources:
    name: Validate source URLs
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run live source checks
        id: livecheck
        env:
          RUN_LIVE_TESTS: "1"
          NVD_API_KEY:       ${{ secrets.NVD_API_KEY }}
          THREATFOX_API_KEY: ${{ secrets.THREATFOX_API_KEY }}
          MB_API_KEY:        ${{ secrets.MB_API_KEY }}
          # One free abuse.ch key for URLhaus, MalwareBazaar and ThreatFox.
          ABUSECH_AUTH_KEY:  ${{ secrets.ABUSECH_AUTH_KEY }}
        run: |
          python -m unittest tests/test_integration.py -v 2>&1 | tee live-check.log

      - name: File issue on broken source
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "📡 Source health check failed — ${{ github.run_id }}" \
            --body "The daily **source URL validation** failed — one or more external feeds/APIs the pipeline depends on is broken or has changed.

          - **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Check the run log to see which source(s) failed, then update the URL(s) in \`scripts/fetch_intel.py\`."
